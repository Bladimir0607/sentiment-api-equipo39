# ============================================================
# VOLÚMENES PERSISTENTES
# ============================================================
# Los volúmenes permiten que los datos persistan al reiniciar contenedores
# - mysql-data: Almacena la base de datos MySQL
# ============================================================

volumes:
  mysql-data:
    driver: local  # Almacenamiento local en el host

# ============================================================
# CONFIGURACIÓN DE REDES
# ============================================================
# Red aislada para comunicación segura entre servicios
# - Todos los servicios pueden comunicarse entre sí usando sus nombres
# - Ejemplo: backend puede conectarse a MySQL usando "mysql:3306"
# ============================================================

networks:
  sentiment-network:
    driver: bridge  # Red tipo bridge (default de Docker)