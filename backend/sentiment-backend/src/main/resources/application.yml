server:
  port: 8080

spring:
  # ============================================================
  # CONFIGURACIÓN DE PERFILES
  # ============================================================
  # El sistema soporta dos perfiles: 'local' (WAMP) y 'docker' (MySQL Docker)
  # Por defecto se usa 'local' para desarrollo con WAMP
  profiles:
    active: local  # Perfil activo por defecto

  # ============================================================
  # CONFIGURACIÓN DE BASE DE DATOS (COMÚN PARA AMBOS PERFILES)
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: update  # En producción cambiar a 'valídate'
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ============================================================
  # CONFIGURACIÓN DE FLYWAY (MIGRACIONES DE BASE DE DATOS)
  # ============================================================
  # Flyway maneja versiones de la base de datos
  # 'repair: true' soluciona el problema de checksum mismatch
  # 'validate-on-migrate: false' evita validación estricta en desarrollo

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    repair: true  # Repara checksum mismatch automáticamente
    out-of-order: true  # Permite migraciones fuera de orden
    validate-on-migrate: false  # Desactiva validación durante migración
    clean-on-validation-error: false  # No limpia base de datos en error

  # ============================================================
  # CONFIGURACIÓN DE INTERNACIONALIZACIÓN (I18N)
  # ============================================================
  # Los archivos de mensajes están en src/main/resources/i18n/
  # Formatos: messages.properties, messages_es.properties, etc.

  messages:
    basename: i18n/messages  # Ruta correcta para archivos de mensajes
    encoding: UTF-8
    fallback-to-system-locale: false

  # ============================================================
  # CONFIGURACIÓN DE REDIS (CACHÉ DISTRIBUIDO)
  # ============================================================
  # Redis se usa para cachear traducciones frecuentes
  # Mejora el rendimiento del servicio de traducción

  data:
    redis:
      host: localhost  # Servicio Redis en Docker
      port: 6379       # Puerto estándar de Redis
      timeout: 2000ms  # Timeout de conexión
      lettuce:
        pool:
          max-active: 8   # Conexiones máximas activas
          max-idle: 8     # Conexiones máximas inactivas
          min-idle: 0     # Conexiones mínimas inactivas

  # ============================================================
  # CONFIGURACIÓN DEL SISTEMA DE CACHÉ
  # ============================================================
  # Spring Cache se integra con Redis para almacenar traducciones

  cache:
    type: redis
    redis:
      time-to-live: 3600000  # Las traducciones se cachean por 1 hora
      cache-null-values: false  # No cachear valores nulos
      key-prefix: "translation:"  # Prefijo para claves de caché
      use-key-prefix: true

  # ============================================================
  # CONFIGURACIÓN DE THREADS PARA TRADUCCIONES CONCURRENTES
  # ============================================================
  # Optimización para manejar múltiples solicitudes de traducción simultáneas

  task:
    execution:
      pool:
        core-size: 10      # Núcleos de threads
        max-size: 20       # Máximo de threads
        queue-capacity: 100 # Capacidad de cola

# ============================================================
# CONFIGURACIÓN DE LOGGING
# ============================================================

logging:
  level:
    org.hibernate.SQL: debug  # Log SQL de Hibernate
    org.flywaydb.core: debug  # Log de Flyway
    com.hackaton.sentiment.service: INFO  # Log de servicios
    org.springframework.cache: INFO  # Log de cache
    org.springframework.web: INFO    # Log de web
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/sentiment-app.log  # Archivo de log
    max-size: 10MB  # Tamaño máximo por archivo

# ============================================================
# CONFIGURACIÓN DE LIBRETRANSLATE (SERVICIO DE TRADUCCIÓN)
# ============================================================
# ⭐ CORREGIDO: La propiedad correcta es 'libretranslate.url'
# LibreTranslate soporta más de 100 idiomas automáticamente
libretranslate:
  url: http://localhost:5000  # URL del servicio LibreTranslate en Docker
  enabled: true               # Habilitar servicio de traducción
  cache-enabled: true        # Usar Redis para cachear traducciones
  timeout: 10000             # Timeout de 10 segundos para traducciones
  retry-count: 2             # Reintentos si falla la traducción

# ============================================================
# CONFIGURACIÓN DEL MICROSERVICIO DE MACHINE LEARNING
# ============================================================
# Servicio del equipo de Data Science para análisis de sentimientos

ml:
  service:
    url: http://localhost:8000  # URL del servicio ML
    timeout: 15000              # Timeout de 15 segundos para análisis

# ============================================================
# CONFIGURACIÓN DE CORS (INTERACCIÓN CON FRONTEND)
# ============================================================
# Permite que el frontend se comunique con el backend
# Ajustar los orígenes según el puerto del frontend

cors:
  allowed-origins: "http://localhost:3000,http://localhost:5173,http://localhost:8081"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true

# ============================================================
# SEPARADOR DE PERFILES - PERFIL 'local' (WAMP)
# ============================================================

---
spring:
  config:
    activate:
      on-profile: local  # Perfil para desarrollo con WAMP

  # ============================================================
  # CONFIGURACIÓN DE BASE DE DATOS PARA PERFIL 'local'
  # ============================================================
  # Conexión a MySQL WAMP en puerto 3306
  # Usa variables de entorno con valores por defecto

  datasource:
    url: jdbc:mysql://localhost:3306/sentimentdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root     
    password: ${DB_ADMIN0_1_PASSWORD} 
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10  # Pool de conexiones máximo
      minimum-idle: 5        # Conexiones mínimas inactivas

# ============================================================
# SEPARADOR DE PERFILES - PERFIL 'docker'
# ============================================================
---
spring:
  config:
    activate:
      on-profile: docker  # Perfil para desarrollo con Docker

  # ============================================================
  # CONFIGURACIÓN DE BASE DE DATOS PARA PERFIL 'docker'
  # ============================================================
  # Conexión a MySQL Docker en puerto 3307
  # Usa variables de entorno con valores por defecto

  datasource:
    url: jdbc:mysql://localhost:3307/sentimentdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root      '
    password: ${DB_ADMIN0_1_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10  # Pool de conexiones máximo
      minimum-idle: 5        # Conexiones mínimas inactivas
