# ============================================================
# CONFIGURACIÓN PRINCIPAL DE SPRING BOOT
# ============================================================
server:
  port: 8080

spring:
  # ============================================================
  # CONFIGURACIÓN DE PERFILES
  # ============================================================
  # Perfiles disponibles:
  # - local: Desarrollo con MySQL WAMP (puerto 3306)
  # - docker: Producción con MySQL Docker (puerto 3307 desde host)
  # - test: Testing con H2 en memoria
  profiles:
    active: local  # Perfil por defecto para desarrollo

  # ============================================================
  # CONFIGURACIÓN DE JPA/HIBERNATE
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: update  # En producción cambiar a 'valídate'
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ============================================================
  # CONFIGURACIÓN DE FLYWAY (MIGRACIONES)
  # ============================================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    repair: true
    out-of-order: true
    validate-on-migrate: false
    clean-on-validation-error: false

  # ============================================================
  # CONFIGURACIÓN DE INTERNACIONALIZACIÓN (I18N)
  # ============================================================
  # Los archivos messages.properties están en src/main/resources/i18n/
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false


  # ============================================================
  # CONFIGURACIÓN DE REDIS (CACHÉ)
  # ============================================================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ============================================================
  # CONFIGURACIÓN DEL SISTEMA DE CACHÉ
  # ============================================================
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hora en milisegundos
      cache-null-values: false
      key-prefix: "translation:"
      use-key-prefix: true

  # ============================================================
  # CONFIGURACIÓN DE THREADS (TRADUCCIÓN CONCURRENTE)
  # ============================================================
  task:
    execution:
      pool:
        core-size: 10
        max-size: 20
        queue-capacity: 100

# ============================================================
# CONFIGURACIÓN DE LOGGING
# ============================================================
logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb.core: debug
    com.hackaton.sentiment.service: INFO
    com.hackaton.sentiment.client: INFO  # 👈 NUEVO: logs de LibreTranslate
    org.springframework.cache: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/sentiment-app.log

# ============================================================
# CONFIGURACIÓN DE LIBRETRANSLATE (TRADUCCIÓN AUTOMÁTICA)
# ============================================================
# ⭐ ESTA ES LA CONFIGURACIÓN CLAVE PARA TU PROYECTO
libretranslate:
  url: http://localhost:5000  # URL del servicio LibreTranslate
  enabled: true               # Habilitar traducción automática
  cache-enabled: true         # Usar Redis para cachear traducciones
  timeout: 10000              # Timeout de 10 segundos
  retry-count: 2              # Número de reintentos

# ============================================================
# CONFIGURACIÓN DEL MICROSERVICIO DE MACHINE LEARNING
# ============================================================
ml:
  service:
    url: http://localhost:8000  # URL del servicio de Data Science
    timeout: 15000              # Timeout de 15 segundos

# ============================================================
# CONFIGURACIÓN DE CORS (FRONTEND)
# ============================================================
cors:
  allowed-origins: "http://localhost:3000,http://localhost:5173,http://localhost:8081"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true

# ============================================================
# PERFIL: LOCAL (DESARROLLO CON WAMP)
# ============================================================
---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/sentimentdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD} # 👈 Variable de entorno o Poner la contrasena directamente
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

# ============================================================
# PERFIL: DOCKER (PRODUCCIÓN CON DOCKER COMPOSE)
# ============================================================
---
spring:
  config:
    activate:
      on-profile: docker

  # ============================================================
  # IMPORTANTE: En Docker, los servicios se comunican por nombre
  # Ejemplo: "mysql" en lugar de "localhost"
  # ============================================================
  datasource:
    url: jdbc:mysql://mysql:3306/sentimentdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD}  # 👈 Variable de entorno o Poner la contrasena directamente 
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # Redis en Docker
  data:
    redis:
      host: redis  # 👈 Nombre del servicio en docker-compose
      port: 6379

# LibreTranslate en Docker
libretranslate:
  url: ${LIBRETRANSLATE_URL:http://libretranslate:5000}  # 👈 Variable de entorno con fallback

# ML Service en Docker
ml:
  service:
    url: ${ML_SERVICE_URL:http://datascience:8000}  # 👈 Variable de entorno con fallback

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

