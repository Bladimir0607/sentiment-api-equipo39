# ============================================================
# CONFIGURACIÓN PARA PRUEBAS CON H2
# ============================================================
spring:
  # ============================================================
  # CONFIGURACIÓN DE DATASOURCE (H2 en memoria)
  # ============================================================
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ============================================================
  # CONFIGURACIÓN DE JPA/HIBERNATE PARA H2
  # ============================================================
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

  # ============================================================
  # DESACTIVAR FLYWAY EN PRUEBAS
  # ============================================================
  flyway:
    enabled: false